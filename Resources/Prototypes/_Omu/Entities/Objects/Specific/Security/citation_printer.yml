- type: entity
  parent: BaseItem
  id: CitationPrinter
  name: citation printer
  description: A handheld thermal printer for issuing security citations.
  components:
  - type: Sprite
    sprite: Objects/Tools/hand_labeler.rsi
    state: hand_labeler

  - type: Item
    sprite: Objects/Tools/hand_labeler.rsi
    storedRotation: -90

  - type: ActivatableUI
    key: enum.CitationPrinterUiKey.Key
    inHandsOnly: true
    requireActiveHand: true
    singleUser: true
    blockSpectators: true

  - type: UserInterface
    interfaces:
      enum.CitationPrinterUiKey.Key:
        type: CitationPrinterBoundUserInterface

  - type: CitationPrinter
    printedPrototype: PaperCitation
    printDelay: 5
    printSound:
      path: /Audio/Machines/printer.ogg
    heading: "SECURITY CITATION"
    footer: "FORMAL NOTICE OF OFFENSE; FURTHER PENALTIES SUBJECT TO OFFICER DISCRETION"

  - type: PhysicalComposition
    materialComposition:
      Plastic: 25


- type: entity
  parent: Paper
  id: PaperCitation
  name: citation slip
  description: A printed citation slip.
  components:
  - type: StaticPrice
    price: 0

  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_receipt_horizontal
      color: "#FFCBDD"

    - state: paper_receipt_horizontal_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false

    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false

  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_dotmatrix.svg.96dpi.png"
    backgroundImageTile: true
    backgroundModulate: "#FFCBDD"
    backgroundPatchMargin: 37.0, 0.0, 37.0, 0.0

    contentImagePath: "/Textures/Interface/Paper/paper_content_dotmatrix.svg.96dpi.png"
    contentImageNumLines: 2
    contentImageModulate: "#FFCBDD"

    contentMargin: 10.0, 8.0, 10.0, 8.0

    fontAccentColor: "#FFFFFF"

    maxWritableArea: 560.0, 260.0